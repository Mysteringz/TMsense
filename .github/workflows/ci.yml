name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install host and firmware tools
        run: python -m pip install numpy==2.2.6 platformio==6.1.18
      - name: Packet host harness
        run: test/host/build_packet_host.sh
      - name: Detector scenarios
        run: python test/host/detector_test.py
      - name: Compile firmware without bench secrets
        run: pio run -e tmflash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/tmflash/firmware.bin
          if-no-files-found: error
          retention-days: 30
