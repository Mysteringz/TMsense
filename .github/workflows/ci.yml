name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install host and firmware tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libmbedtls-dev
          python -m pip install numpy==2.2.6 platformio==6.1.18 cryptography==50.0.2
      - name: Native authenticated-encryption vectors and tampering tests
        run: bash test/host/build_secure_host.sh
      - name: Packet host harness
        run: test/host/build_packet_host.sh
      - name: Detector scenarios
        run: python test/host/detector_test.py
      # The direct-to-cloud transport's framing, control parser, URL rules,
      # queue and session state machine, compiled from src/ unchanged.
      - name: Cloud transport host tests
        run: test/host/build_cloud_host.sh && build/cloud_test && build/display_test
      - name: OTA, settings and sensor fault regressions
        run: bash test/host/build_safety_host.sh && build/safety_test && python test/host/listen_test.py
      - name: Compile firmware without bench secrets
        run: pio run -e tmflash
      - name: Compile the test-fixture build too (never released)
        run: pio run -e tmsense_testcloud
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ github.sha }}
          path: .pio/build/tmflash/firmware.bin
          if-no-files-found: error
          retention-days: 30
