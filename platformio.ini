; TMnode firmware. Build with PlatformIO (`pio run -t upload`) or with
; arduino-cli via tools/build.sh -- both use the same src/ and include/.
[platformio]
src_dir = src
include_dir = include

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Release image used by TMflash: the same firmware without include/node_config.h
; bench defaults, so a flashed binary never carries a Wi-Fi password or key.
; TMflash provisions those over serial after flashing.
[env:tmflash]
extends = env:heltec_wifi_lora_32_V3
build_flags = ${env:heltec_wifi_lora_32_V3.build_flags} -DTM_NO_NODE_CONFIG
