; TMnode firmware. Build with PlatformIO (`pio run -t upload`) or with
; arduino-cli via tools/build.sh -- both use the same src/ and include/.
[platformio]
src_dir = src
include_dir = include

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -Wall
